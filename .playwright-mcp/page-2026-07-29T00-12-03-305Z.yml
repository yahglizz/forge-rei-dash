          - paragraph [ref=f59e629]:
            - strong [ref=f59e630]: C. Listing Currency Conversion Considerations for Sellers.
            - text: When a seller lists and subsequently sells an item in a currency other than the currency of the seller's payment account, Etsy will settle the associated transaction proceeds in the currency of the seller's payment account. When such a service is required, Etsy applies an additional 2.5% currency conversion fee. Calculation rates are updated regularly.
          - paragraph [ref=f59e631]:
            - strong [ref=f59e632]: D. Value-Added Tax (VAT).
            - text: Depending on your business status and location, Etsy may be required to charge the prevailing applicable VAT rate on seller fees accrued each month and remit it to the relevant tax authority. VAT is collected on Etsy Payments processing fees for sellers located in
            - link "eligible Etsy Payments countries" [ref=f59e633] [cursor=pointer]:
              - /url: https://help.etsy.com/hc/articles/115015710408
            - text: where required. To learn more about how VAT works on Etsy, see
            - link "this Help article" [ref=f59e634] [cursor=pointer]:
              - /url: https://help.etsy.com/hc/articles/360000337247
            - text: . Etsy reserves the right to charge tax rates based on the tax information provided and adjust tax rates if the tax information is incorrect or invalid.
          - paragraph [ref=f59e635]:
            - strong [ref=f59e636]: E. Sales Tax.
            - text: Where applicable, sales tax will be applied to certain fees charged by Etsy. To learn more about how sales tax works, see
            - link "this Help article" [ref=f59e637] [cursor=pointer]:
              - /url: https://help.etsy.com/hc/articles/35267490737431
            - text: . Etsy reserves the right to charge sales tax based on the tax information provided by you, and may adjust these tax rates if your tax information is incorrect or invalid. You are solely responsible for keeping your location information accurate and current. If your location changes, please update your location information on Etsy as soon as possible.
          - paragraph [ref=f59e638]:
            - strong [ref=f59e639]: F. Browsing Currency Considerations for Buyers.
            - text: In the case of a buyer purchasing from a seller who lists in a currency other than the buyer's browsing currency, Etsy will automatically calculate the listing price in the buyer's browsing currency. When such a calculation is required, Etsy applies an additional currency conversion charge. Calculation rates are updated regularly.
          - paragraph [ref=f59e640]:
            - strong [ref=f59e641]: G. Interest.
            - text: In the United States, Etsy may earn interest (or other compensation) from the balances in our bank accounts because of the timing difference between our being paid by buyers and our paying sellers (when our bank account is being debited to pay Available Funds in payment accounts to sellers).
          - heading "10. Reporting Obligations" [level=2] [ref=f59e642]
          - paragraph [ref=f59e643]:
            - strong [ref=f59e644]: US
          - paragraph [ref=f59e645]:
            - text: Internal Revenue Service regulations require that we file a Form 1099-K to report unadjusted annual gross sales information for sellers located in the United States or being paid in USD in certain circumstances. Please see
            - link "this Help article" [ref=f59e646] [cursor=pointer]:
              - /url: https://help.etsy.com/hc/articles/360000336447
            - text: for more details.
          - paragraph [ref=f59e647]: To comply with these regulations, sellers who meet or approach applicable thresholds in a calendar year, aggregated across his or her Shops, will be required to provide taxpayer-identification information to Etsy.
          - paragraph [ref=f59e648]:
            - text: In addition to the IRS reporting requirements referenced above, certain states have enacted similar reporting regulations, and sellers who meet or approach applicable state thresholds will also be required to provide taxpayer-identification information to Etsy. Please see this
            - link "Help article" [ref=f59e649] [cursor=pointer]:
              - /url: https://help.etsy.com/hc/articles/360000336447
            - text: for details of reporting threshold requirements related to the specific states.
          - paragraph [ref=f59e650]:
            - strong [ref=f59e651]: Non-US
          - paragraph [ref=f59e652]: Etsy is also required to withhold taxes and/or report tax information to local tax authorities in certain countries outside the US. These withholding tax and reporting obligations are triggered when sellers make sales via Etsy and relevant requirements/thresholds for withholding and/or reporting are met.
          - paragraph [ref=f59e653]: To comply with these withholding tax and/or reporting obligations, Etsy requires that you add your taxpayer name, taxpayer-identification and/or other applicable information to your Etsy shop as you approach the relevant thresholds. You are responsible for providing valid and accurate tax information. If you provide inaccurate or invalid tax information, Etsy may remove the information, suspend your selling privileges until you provide corrected information and/or take whatever action is deemed necessary per local tax rules without notice. Etsy may also adjust the amounts charged for withholding tax and/or taxes on seller fees, or may incorrectly calculate and remit applicable withholding tax, based on any inaccurate or invalid information you provide. You will be responsible for correcting any incorrect reporting and withholding with the relevant taxing authority due to inaccurate or invalid information you provide.
          - heading "11. Termination" [level=2] [ref=f59e654]
          - paragraph [ref=f59e655]: Sellers may terminate this contract and their acceptance of Etsy Payments at any time by adjusting the Settings in their account with Etsy. Etsy may also terminate or suspend a seller’s use of Etsy Payments at any time.
          - paragraph [ref=f59e656]: Upon termination, any non-disputed Available Funds will be deposited into a seller’s bank account or a seller’s Payoneer Payment Account, as applicable. Etsy reserves the right, upon termination of access to Etsy Payments, to set off against any payments to be made to the seller, an amount determined by us to be adequate to cover any anticipated chargebacks, refunds, adjustments, or other amounts that might be paid to buyers in connection with purchases from the seller's payment account for a prospective 180-day period. At the end of the 180-day period following termination, we will disburse to the seller any amount not used to offset chargebacks, refunds, adjustments, or such other amounts paid to buyers, or seek reimbursement from the seller via any of the means authorized in this Policy for any additional amount required to offset chargebacks, refunds, adjustments, or other amounts paid to buyers, as applicable.
          - heading "12. Canadian Sellers" [level=2] [ref=f59e657]
          - paragraph [ref=f59e658]: In addition to the terms above, this section applies if you live in Canada. ECL has applied to become a registered payment service provider under the Retail Payment Activities Act (Canada). ECL will safeguard any Available Funds it is holding for you by holding an amount equivalent to your Available Funds balance, in trust on your behalf, in a segregated account at a financial institution that is not used for any other purpose. By using the Services, you confirm that you intend for ECL to hold such amount in trust on your behalf. You will not be entitled to any interest earned, if any, on the amount held in trust on your behalf. ECL will be responsible for disbursing your funds.
          - paragraph [ref=f59e659]: Last updated on Feb 12, 2026
