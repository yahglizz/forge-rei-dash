          - heading "1. Accepting These Terms" [level=2] [ref=f59e126]
          - paragraph [ref=f59e127]: The Etsy Payments Policy (or the “Policy”) sets out your rights and responsibilities when you use Etsy Payments on Etsy’s services (we’ll refer to Etsy.com, Etsy's mobile apps, and other services as our “Services”), so please read it carefully. By using Etsy Payments, you’re agreeing to the Policy.
          - paragraph [ref=f59e128]: The Policy is a legally binding contract between you and Etsy.
          - list [ref=f59e129]:
            - listitem [ref=f59e130]: If you live in North America or South America, except Canada, the contract is between you and Etsy, Inc.
            - listitem [ref=f59e131]:
              - text: If you live in Canada, as of September 8, 2025, this contract is between you, Etsy, Inc., and Etsy Canada Limited (ECL), a subsidiary of Etsy, Inc; thereafter, the services described in Section 12 (Canadian Sellers) below will be provided by ECL, and all other services will be provided by Etsy, Inc. If you live in the European Economic Area (EEA), this contract is between you, Etsy Ireland UC, and Etsy Payments Ireland Limited (EPIL), a subsidiary of Etsy, Inc. In addition to the terms below, you are also subject to these
              - link "EPIL specific terms" [ref=f59e132] [cursor=pointer]:
                - /url: https://www.etsy.com/legal/policy/etsy-payments-ireland-limited-terms-and/1291212895325
              - text: for seller disbursements and all other services are provided by Etsy Ireland UC. To the extent the
              - link "EPIL terms" [ref=f59e133] [cursor=pointer]:
                - /url: https://www.etsy.com/legal/policy/etsy-payments-ireland-limited-terms-and/1291212895325
              - text: and these terms conflict, the EPIL terms will govern. The
              - link "EPIL terms" [ref=f59e134] [cursor=pointer]:
                - /url: https://www.etsy.com/legal/policy/etsy-payments-ireland-limited-terms-and/1291212895325
              - text: only apply to Seller disbursement services.
            - listitem [ref=f59e135]: If you live elsewhere, the contract is between you and Etsy Ireland UC, a subsidiary of Etsy, Inc.; We’ll just refer to Etsy, Inc. and all of its subsidiaries collectively as “Etsy.
          - paragraph [ref=f59e136]: ETSY PAYMENTS IRELAND LIMITED IS REGULATED BY THE CENTRAL BANK OF IRELAND AS A PAYMENT INSTITUTION. YOU WILL ONLY ENTER INTO A CONTRACT WITH ETSY PAYMENTS IRELAND LIMITED IF YOU ARE A SELLER IN THE EUROPEAN ECONOMIC AREA AND HAVE ONBOARDED AS AN EPIL SELLER.
          - paragraph [ref=f59e137]: IF YOU ARE A SELLER LOCATED OUTSIDE THE EUROPEAN ECONOMIC AREA, YOU WILL NOT ENTER INTO A CONTRACT WITH ETSY PAYMENTS IRELAND LIMITED. THIS MEANS THAT ANY SUCH CONTRACT WILL BE WITH AN ETSY COMPANY THAT IS NOT REGULATED BY THE CENTRAL BANK OF IRELAND AND NOT SUBJECT TO THE SAME REGULATORY PROTECTIONS AS A PAYMENT INSTITUTION AUTHORISED IN IRELAND UNDER THE EUROPEAN UNION (PAYMENT SERVICES) REGULATIONS 2018.
          - paragraph [ref=f59e138]:
            - strong [ref=f59e139]: Sellers resident in Argentina, Brazil, Chile, China, Egypt, Georgia, India, Japan, Kazakhstan, Pakistan, Peru, Serbia, South Korea, Thailand, United Arab Emirates, & Ukraine
            - text: are required to onboard to Etsy Payments by registering directly with a third-party payments provider, Payoneer. Sellers who register for Payoneer’s wallet service will link their bank account to Payoneer to receive payments for their sales on Etsy via a Payoneer Payment Account (“Payoneer Payment Account”). Payoneer’s processing of your information and provision of service to you is subject to their own privacy policy and terms (including Payoneer withdrawal fees).
          - heading "2. Overview" [level=2] [ref=f59e140]
          - paragraph [ref=f59e141]:
            - text: Etsy Payments allows sellers to (a) accept payment by authorized credit and debit card transactions, some bank transfers services, PayPal (where available), transactions using Apple Pay, and transactions using Google Pay, (b) have those funds reflected in a seller’s payment account on Etsy, and (c) have those funds deposited into a seller’s designated bank account
            - emphasis [ref=f59e142]: . Etsy reserves the right to add or remove payment methods accepted by Etsy Payments in its sole discretion, with notice where required by applicable law.
            - text: "In the case of sellers registered with Payoneer, Etsy will send your funds, per the schedule displayed in your Payment Account, to your linked Payoneer Payment Account (and not directly to your bank account). Sellers with linked Payoneer Payment Accounts can select to withdraw available funds to their local bank account. Sellers who use Payoneer’s payment service may be subject to Payoneer withdrawal minimums and additional Payoneer fees, including Payoneer withdrawal fees typically up to 3% of the transaction amount. You can log in to your Payoneer account for more details on applicable Payoneer fees and you can learn more about Payoneer fees here: https://www.payoneer.com/about/pricing/. Etsy is not responsible for funds after they are sent to your linked Payoneer Payment Account."
          - paragraph [ref=f59e143]: Etsy Payments is only available to sellers who are at least 18 years old who register and are approved for a payment account with Etsy. Etsy Payments is currently available to sellers in Australia, Austria, Belgium, Bulgaria, Canada, Croatia, Cyprus, Czech Republic, Denmark, Estonia, Finland, France, Germany, Greece, Hong Kong, Hungary, Indonesia, Ireland, Israel, Italy, Latvia, Lithuania, Luxembourg, Malaysia, Malta, Mexico, Morocco, Netherlands, New Zealand, Norway, Philippines, Poland, Portugal, Romania, Singapore, Slovakia, Slovenia, South Africa, Spain, Sweden, Switzerland, Türkiye, United Kingdom, United States and Vietnam. Etsy Payments via Payoneer is currently available to sellers in Argentina, Brazil, Chile, China, Egypt, Georgia, India, Japan, Kazakhstan, Pakistan, Peru, Serbia, South Korea, Thailand, United Arab Emirates, & Ukraine.
          - paragraph [ref=f59e144]: Sellers may only use Etsy Payments for the sale of items listed on Etsy’s Services, and agree to ship sold items once a payment transaction is complete and reflected in their payment account. Etsy reserves the right to terminate a seller’s access to Etsy Payments if the seller uses Etsy Payments in any other manner.
          - paragraph [ref=f59e145]: Buyers and Sellers benefit from Etsy having visibility into payments made on Etsy via Etsy Payments, because it can make the Services easy to use and enables Etsy to more effectively provide support to sellers or buyers where relevant. It also can help reduce fraud and other types of misuse of the Etsy platform.
          - heading "3. Third-Party Services" [level=2] [ref=f59e146]
          - paragraph [ref=f59e147]: Etsy has engaged third-party service providers that provide you with regulated payment services and perform many of the services related to payment processing, including card processing, disbursements, currency exchange, identity verification, fraud analysis, and regulatory compliance.
          - paragraph [ref=f59e148]: Etsy partners with Worldpay, PayPal, Adyen, Payoneer, and other licensed payment providers to facilitate card payments and other payments and the disbursement of funds to sellers in different countries. The payment provider and processing time for your payment will vary based on the country in which you're located.
          - paragraph [ref=f59e149]: Etsy may share your personal or transactional information with those third-party service providers for purposes related to payments processing.
          - paragraph [ref=f59e150]: If Etsy receives notice that your shop's content or activity violates a third party's service agreement, we may at our sole discretion take action against your account to comply with their policies. Such actions may include canceling a transaction, disabling listings from your shop, suspending or terminating your selling privileges, or removing certain payment methods.
          - paragraph [ref=f59e151]:
            - strong [ref=f59e152]: PayPal
          - paragraph [ref=f59e153]: "Etsy supports two versions of PayPal: integrated PayPal and standalone PayPal."
          - paragraph [ref=f59e154]:
            - strong [ref=f59e155]: Integrated PayPal.
            - text: In countries where PayPal is available and can be integrated with Etsy Payments, Integrated PayPal allows sellers to receive funds from PayPal purchases directly into their Etsy payment account, without the need to manage a separate PayPal account. This means that if a buyer pays with PayPal, the funds from the order will be credited to a seller's payment account along with the rest of the orders. The standard Etsy Payments Payment Processing Fee (described below) applies to orders that go through integrated PayPal; there is no additional PayPal fee.
          - paragraph [ref=f59e156]:
            - strong [ref=f59e157]: Standalone PayPal.
            - text: Standalone PayPal exists for sellers in countries that are not yet eligible for Etsy Payments and/or, in Etsy's discretion, in some markets where it’s not an Etsy requirement to use Etsy Payments. Standalone PayPal may not be available to you if you do not have an active Etsy shop and Etsy Payments is not yet available in your country, which means you will be unable to open a shop on Etsy. Standalone PayPal will not be available to new sellers who join Etsy if Etsy Payments is available in that seller’s country. If this is the case, the seller will be required to register on Etsy Payments as part of their onboarding to Etsy. For sellers accepting standalone PayPal, you will receive funds from PayPal purchases directly into your PayPal account. Sellers who accept standalone PayPal will continue to pay PayPal fees. Orders paid through standalone PayPal are not covered by Etsy’s Purchase Protection program for sellers. Etsy reserves the right to allow certain sellers in countries that are eligible for Etsy Payments to also use Standalone PayPal for a limited time. Please note, during this transition period, it may be necessary for Etsy to process some PayPal transactions through integrated PayPal. For example, if a buyer chooses to pay with an Etsy Gift Card or Etsy Credit and covers the remaining balance using PayPal, Etsy can only process the transaction through integrated PayPal. Similarly, if a buyer purchases items from multiple shops in a single transaction and chooses PayPal as the payment method, Etsy may have to process the transaction through integrated PayPal.
          - heading "4. Etsy’s Rights and Responsibilities" [level=2] [ref=f59e158]
          - paragraph [ref=f59e159]:
            - text: Etsy Payments functionality may be made available, modified, or discontinued by us at any time without notice and is subject to the limitations in Etsy’s
            - link "Terms of Use" [ref=f59e160] [cursor=pointer]:
              - /url: https://www.etsy.com/legal/terms
            - text: .
          - paragraph [ref=f59e161]: "As a security measure, we may impose transaction limits on buyers and sellers. For example, we may impose limits relating to the value of any transaction, deposit, or adjustment, or limits relating to the cumulative value of all transactions, deposits, or adjustments during a period of time. We may also impose limits related to the number of transactions per day or other period of time. We will not be liable to a seller: (a) if we do not proceed with a transaction, deposit, or adjustment that would exceed any limit established by us, or (b) if we permit a buyer to withdraw from a transaction."
          - paragraph [ref=f59e162]: Etsy may refuse service of Etsy Payments to anyone, for any reason, at any time.
          - paragraph [ref=f59e163]:
            - text: Etsy reserves the right to decline or refund transactions that we believe to be high risk, fraudulent, in violation of trade sanctions, or otherwise in violation of Etsy’s
            - link "Terms of Use" [ref=f59e164] [cursor=pointer]:
              - /url: https://www.etsy.com/ie/legal/terms-of-use
            - text: .
          - paragraph [ref=f59e165]: In the event that a buyer does not make payment for the purchase of a legitimate item sold using Etsy Payments (e.g., where the buyer used a stolen or unauthorized credit card), Etsy may provide limited payment protection to the seller, in the interest of fairness.
          - paragraph [ref=f59e166]:
            - text: Etsy maintains records associated with transactions on Etsy Payments and does not pass any secure data, including credit card numbers or bank account information, to any sellers. Sellers will receive shipping information and limited buyer account and other information necessary to complete the order. Etsy’s
            - link "Privacy Policy" [ref=f59e167] [cursor=pointer]:
              - /url: https://www.etsy.com/legal/privacy
            - text: further explains how Etsy handles user information.
          - paragraph [ref=f59e168]:
            - text: Etsy will send you any relevant notices regarding your use of Etsy Payments in accordance with our
            - link "Electronic Communications Policy" [ref=f59e169] [cursor=pointer]:
              - /url: https://www.etsy.com/legal/electronic-communications
            - text: .
          - heading "5. Seller Rights and Responsibilities" [level=2] [ref=f59e170]
          - paragraph [ref=f59e171]:
            - strong [ref=f59e172]: A. Use of Etsy Payments.
            - text: If you live in a country in which Etsy Payments is available, you are required to sign up for Etsy Payments, except as otherwise determined by Etsy in its sole discretion. Using Etsy Payments will result in your shop accepting payment through authorized credit and debit card transactions, some bank transfer services, PayPal, Etsy Gift Card, Etsy Credits, Etsy Coupons, Apple Pay, Google Pay, and Klarna (where available). For you to sign up for Etsy Payments and receive payment for transactions made through Etsy Payments, you must provide all required information and complete all required steps, including in some markets, verifying your bank account, for compliance purposes. Without this information, payment cannot be made to you and, in some cases, your account functionality may be otherwise limited. You can find instructions about how to upload your bank account information
            - link "here" [ref=f59e173] [cursor=pointer]:
              - /url: https://help.etsy.com/hc/articles/115015775908
            - text: . If you live in a country in which Etsy Payments is available and you do not provide Etsy with this information, Etsy may refuse you access to the Services until you do so. In Argentina, Brazil, Chile, China, Egypt, Georgia, India, Japan, Kazakhstan, Pakistan, Peru, Serbia, South Korea, Thailand, United Arab Emirates, & Ukraine, you will link your Etsy payment account with a Payoneer Payment Account to access Etsy Payments.
          - paragraph [ref=f59e174]:
            - strong [ref=f59e175]: B. Payment Accounts.
            - text: A payment account is a notional ledger that allows sellers to track payment amounts, refunds, and fees related to transactions and seller services. Sellers must provide accurate personal information as requested during registration, and are responsible for maintaining and updating that information as necessary. Sellers will not impersonate any person or use any name they are not legally authorized to use. Sellers authorize us, our authorized agents and third party service providers, to verify their information (at registration and from time to time when using the Services), including by accessing public records and obtaining credit reports about the sellers. Etsy verifies sellers’ information in order to safeguard the integrity of the marketplace and reduce the risk of fraud, money laundering, terrorist financing, and the violation of trade sanctions.
          - paragraph [ref=f59e176]:
            - text: Payment accounts are only available to individuals who are eligible to be sellers on Etsy’s Services and who have a valid credit or debit card on file with Etsy, unless Etsy expressly waived this requirement for the particular seller. By accepting the applicable Services terms, you consent to store your card on file in accordance with the terms of this Policy by indicating your acceptance during seller onboarding or within your seller account. If for some reason, we cannot collect that consent, it will otherwise be deemed to be provided from you once you provide us with your card credentials, and in any event, at the time of the initial transaction. By agreeing to store your card on file, you authorize Etsy to store your account number, cardholder name, expiration date, and network token, and to exclusively charge your stored card for amounts owed to Etsy (including for refunds, reimbursements, chargebacks, adjustments, claims, seller fees and charges, and other charges as described in the Policy) where your Available Funds (as defined below) do not sufficiently cover such charges. You may withdraw your consent to store your card on file and authorization for Etsy to charge this card at any time by closing your Etsy account
            - link "here" [ref=f59e177] [cursor=pointer]:
              - /url: https://help.etsy.com/hc/en-us/requests/new#issue_account_closing_etsy_account-solution_primary
            - text: . You will need to update Etsy if your card details change, expire, are cancelled or otherwise become unusable. You understand that the authorizations and consents given will remain in effect until cancelled, withdrawn or our relationship is terminated (as applicable). By withdrawing your consent or authorization, or our relationship otherwise terminates, your card details will be deleted by Etsy in due course, and your account will be terminated such that you will no longer be able to sell on Etsy. For avoidance of doubt, you will continue to remain liable for any amounts owed to Etsy even after your withdrawal of consent and authorization of the card on file or our relationship otherwise terminates. You may be required to pay your outstanding liabilities to Etsy prior to withdrawing your consent and authorization and terminating your account.
          - paragraph [ref=f59e178]: Etsy may automatically enroll you in autobilling, or you may have the option to opt in, which Etsy will separately communicate to you. Autobilling allows Etsy to charge your card on file automatically each month to pay your Etsy bill. You may turn off autobilling in your Payment settings in the Finances tab of Shop Manager. If you turn off autobilling on or after the first of the month, we may still bill your account for the prior month and autobilling will be turned off going forward. Turning off autobilling does not otherwise revoke your consent or authorization for Etsy to store or charge your card on file, which may only be revoked by closing your Etsy account as outlined above.
          - paragraph [ref=f59e179]:
            - strong [ref=f59e180]: C. Disputes.
            - text: Sellers agree to resolve any disputes directly with a buyer or with the assistance of the dispute management and refund tools available on Etsy, and in accordance with our
            - link "Seller Policy" [ref=f59e181] [cursor=pointer]:
              - /url: https://www.etsy.com/legal/sellers
            - text: and
            - link "Terms of Use" [ref=f59e182] [cursor=pointer]:
              - /url: https://www.etsy.com/legal/terms
            - text: . In the event that a dispute is escalated to Etsy’s Support Team, Etsy reserves the right to issue a refund to a buyer and recoup such funds from the seller if a transaction is found to be in violation of Etsy’s policies.
          - paragraph [ref=f59e183]: In the event that a buyer submits a chargeback, Etsy will respond to the credit card networks on behalf of the seller involved in the transaction; the seller agrees to provide any requested information to us within five calendar days of the request. Etsy reserves the right to recoup funds associated with buyer chargebacks from the seller.
          - paragraph [ref=f59e184]:
            - strong [ref=f59e185]: D. Communications.
            - text: We will inform sellers of each transaction, or of other information pertaining to Etsy Payments, using our standard communication procedures (detailed in our
            - link "Electronic Communications Policy" [ref=f59e186] [cursor=pointer]:
              - /url: https://www.etsy.com/legal/electronic-communications
            - text: ), including by email or through Etsy's Messages tool.
          - paragraph [ref=f59e187]:
            - strong [ref=f59e188]: E. Refunds.
            - text: Refunds or adjustments paid by Etsy to buyers for payments made through Etsy Payments may be initiated using the refund functionality in the seller's payment account for a period of 180 days after the purchase was made. The Etsy Payments Platform does not have refund functionality after 180 days from the original purchase date. Any such funds paid by Etsy to cover refunds will be deducted from the seller’s payment account balance. If there are insufficient funds to cover the amount of the refund, the balance will be charged to the seller’s card on file or added to the seller’s payment account. Refunds issued by Etsy will be in the original form of payment, and if the buyer chooses an Etsy Credit as their refund or such payment is not available, an Etsy credit will be issued.
          - paragraph [ref=f59e189]:
            - text: For full refunds to buyers who used an
            - link "Etsy Coupon" [ref=f59e190] [cursor=pointer]:
              - /url: https://www.etsy.com/legal/gift-cards/
            - text: towards their underlying purchase, the buyer will be refunded the amount they paid as part of the purchase, and Etsy will be refunded the amount contributed by Etsy via the Etsy Coupon. For partial refunds to buyers who used an Etsy Coupon towards their underlying purchase, refunds will be made to the buyer and Etsy proportionate to the amount contributed to the underlying purchase (in Etsy’s case via an Etsy Coupon). You can read more about how refunds are treated in the case of purchases made using Etsy Coupons
            - link "here" [ref=f59e191] [cursor=pointer]:
              - /url: https://www.etsy.com/legal/gift-cards/
            - text: .
          - paragraph [ref=f59e192]: Etsy reserves the right to refund buyers and recoup such refunded amounts from the seller where the seller has been refused service by Etsy in accordance with Etsy’s Terms of Use; and/or in circumstances where a seller is under Reserve as detailed in Section 7 (Deposit); and/or in circumstances where the seller has unfulfilled or overdue orders.
          - paragraph [ref=f59e193]:
            - text: Fully refunded transactions may be eligible for cancellation in accordance with our
            - link "Cancellation Policy" [ref=f59e194] [cursor=pointer]:
              - /url: https://www.etsy.com/legal/policy/cancellation-policy/253925018785
            - text: .
          - paragraph [ref=f59e195]:
            - strong [ref=f59e196]: F. International Trade Laws
            - text: . You agree that your use of Etsy Payments will not involve any countries, entities, individuals, or items prohibited by sanctions, embargoes, regulations, or orders administered by the US Department of Treasury’s Office of Foreign Assets Control (“OFAC”) or other government agencies. See our
            - link "Sanctions Policy" [ref=f59e197] [cursor=pointer]:
              - /url: https://www.etsy.com/legal/policy/sanctions-policy/122383404929
            - text: for more information.
          - paragraph [ref=f59e198]:
            - strong [ref=f59e199]: G. Information on Cardholder Charges
            - text: . Please note that your bank or card provider may charge additional fees (including cross-border fees) for transactions that you make on Etsy. These fees are not charged by Etsy and are at the discretion of your bank. Please contact your bank for further details.
          - heading "6. Appointment of Etsy as Collection Agent for Sellers" [level=2] [ref=f59e200]
          - paragraph [ref=f59e201]: Each seller appoints Etsy as its agent for the purpose of receiving, holding, and settling payments to seller, less any amounts owed to Etsy and subject to these Terms. Each seller accordingly authorizes Etsy to represent to buyers and third parties that they are the seller's agent for the foregoing purposes. Notwithstanding the prior sentence, no agency is established for tax or for any other purpose, other than to complete a transaction as set forth in the penultimate sentence of this section.Each seller agrees that a buyer payment received by Etsy, on behalf of seller, satisfies the buyer's obligations to make payment to seller, regardless of whether Etsy actually settles such payment to seller. If Etsy does not settle any such payments as described in these Terms to a seller, such seller will have recourse only against Etsy and not the buyer. Each seller irrevocably appoints and authorises Etsy to act as its sole and exclusive agent for the purpose of concluding contracts for the sale of items to a buyer in accordance with the seller’s instructions by means of transactions through Etsy’s Services. The legal contract for the purchase of each seller’s goods will in all cases be between the seller and the relevant buyer.
          - heading "7. Deposits" [level=2] [ref=f59e202]
          - paragraph [ref=f59e203]:
            - strong [ref=f59e204]: A. Payment Account.
          - paragraph [ref=f59e205]: All funds resulting from a completed transaction will be reflected as a balance in a seller’s payment account. Transactions are considered complete at the later of once the payment is approved by Etsy or our fraud analysis service provider. Any refunds, adjustments, or other amounts paid to buyers in connection with purchases, or for funds received since the last payment day, are also applied to the seller’s payment account balance.
          - paragraph [ref=f59e206]: Funds displayed in a seller’s payment account balance are eligible for deposit (the “Available Funds”) via our payments partners into a seller’s bank account or other applicable account (i.e., a Payoneer Payment Account), subject to any applicable reserve(s) and corresponding reserve limit, hold, or deposit delay, as described in Section B. Reserves; Holds and Delays below, and as otherwise determined by the seller’s bank.
          - paragraph [ref=f59e207]: For deposits below designated thresholds in certain markets, a deposit fee will apply. See Section 9 below for details on deposit fees. A deposit minimum also applies to deposits in certain markets. Funds will only be available for deposit if they exceed the applicable deposit minimum.
          - paragraph [ref=f59e208]:
            - strong [ref=f59e209]: B. Reserves; Holds and Delays
          - paragraph [ref=f59e210]: To protect the security and integrity of our marketplace, the users of the Etsy services, and Etsy, Etsy may instruct our payment partners to take account-level or transaction-level actions based on risk-based criteria, like the criteria listed below. Some of our decisions about reserves, holds and delays may be based on criteria that demonstrate a seller’s ability to fulfill orders in a manner consistent with Etsy’s policies. These criteria are essential to our management of risk and the protection of Etsy and our users. Etsy reserves the right to use a combination of reserves, deposit delays, and holds on your account via instruction to our payment partners.
          - paragraph [ref=f59e211]:
            - strong [ref=f59e212]: Reserves.
          - paragraph [ref=f59e213]: A Reserve is an amount of money pending settlement as indicated in your payment account. A Reserve will be placed on your account if we believe there may be a high level of financial risk associated with you, your account, your business model, or your transactions.
          - paragraph [ref=f59e214]: When a Reserve is applied on your payment account, it means that a percentage of the funds in your payment account balance is held on an ongoing basis, and will not be made available for disbursement as Available Funds for a specified period of time. The Reserve percentage applies to amounts from your sales that would otherwise be available for disbursement. The percentage Reserve applied to your account is determined by your risk level and is used to create a threshold amount (explained in detail below) that applies to your payment account balance while you are in Reserve. You’ll be notified by email if a Reserve is applied to your Payment Account. The email you receive notifying you that you are in Reserve will include details of the Reserve, including the period of Reserve and the percentage applied to your Payment Account.
          - list [ref=f59e215]:
            - listitem [ref=f59e216]:
              - emphasis [ref=f59e217]:
                - strong [ref=f59e218]: Threshold Reserve Amount applicable to your Account
            - listitem [ref=f59e219]: The threshold reserve amount is the amount of funds you must have in your Payment Account while you’re in Reserve before you’ll have money available to disburse to your bank account (the “Threshold Reserve Amount”). The Threshold Reserve Amount will maintain the percentage Reserve that has been applied to your account. As a result, it may increase and decrease as appropriate to reflect new activity in your payment account, like sales you’ve received, refunds and chargebacks, charges to your payment account where applicable, as well as and Reserve amounts released to you. The Threshold Reserve will also determine the amount of funds available to be disbursed to your bank account as Available Funds and the amount of funds that are pending, because they are still in Reserve. Funds in excess of the Threshold Reserve Amount are available to you for disbursement as described in Section 7A above. Funds below the Threshold Reserve Amount are your Reserved funds and are not available for disbursement until the end of the applicable Reserve period. If your Reserve funds are used to cover any charges and your Reserve funds fall below the Threshold Reserve Amount, funds from subsequent sales will be applied to your Reserve funds to help you meet and maintain your Threshold Reserve Amount. You can view your Threshold Reserve Amount, as well as any Reserved funds and funds available to you for disbursement (Available Funds), in your Payment Account.
          - paragraph [ref=f59e220]: "Reserve funds will be used to address potential financial risk such as refunds, chargebacks, claims, or seller fees and charges, where your Available Funds do not sufficiently cover such charges. Reserve funds that are not used to address refunds, chargebacks, claims or seller fees, where applicable, will be released to you in full at the end of the corresponding Reserve period on a rolling basis. However, Reserve funds will not be released if, during the Reserve period relating to a particular sale, a buyer raises a case against you, or files a chargeback, and you do not have sufficient funds in your Available Funds to cover a potential refund. Etsy relies on different risk factors (and whether and how these factors have changed over time) to determine whether and how much of a Reserve should be applied to your payment account, including:"
          - list [ref=f59e221]:
            - listitem [ref=f59e222]: How long you’ve been in business on Etsy (including how long since you’ve made your first sale)
            - listitem [ref=f59e223]: Details of your sales (including volume and average sales earnings)
            - listitem [ref=f59e224]: The extent of any backlog of orders from your shop
            - listitem [ref=f59e225]: Availability of shipping tracking information
            - listitem [ref=f59e226]: Types of goods you sell (whether they’re ready to ship or made to order)
            - listitem [ref=f59e227]: Ratio of cases (disputes) opened by buyers in respect of your sales
            - listitem [ref=f59e228]: Suspensions or warnings already received
            - listitem [ref=f59e229]: Estimated delivery times; and
            - listitem [ref=f59e230]: Shipping status of active orders
          - paragraph [ref=f59e231]:
            - strong [ref=f59e232]: "Types of Account Reserves:"
          - paragraph [ref=f59e233]: A fixed reserve is a fixed percentage of your payment account balance at the time a Reserve is placed on your account, which will be held for a specified period of time. After that, the same percentage of each of your subsequent sales will be held in Reserve, each for a specified period of time. Reserve funds will be held for such period and where applicable, will be used to address chargebacks, refunds, and pay seller fees. Reserve funds will be released on a rolling basis after the corresponding Reserve period expires, unless a case is raised against you by a buyer. Any funds above the Threshold Amount of your Reserve will be available to be disbursed as described in Section 7A.
          - list [ref=f59e234]:
            - listitem [ref=f59e235]: For example, your Reserve could be set at 30% and held for a 45-day rolling period – meaning 30% of the funds in your payments account balance on day 1 are Reserved and then released on day 46. If you make a sale on day 2, 30% of the funds you receive from that sale on day 2 is reserved until day 47, etc. If you make a sale on day 4, 30% of the funds you receive from that sale are reserved until day 49. If any chargebacks are filed against you, or refunds to buyers are required, or seller fees are charged, and your Available Funds are insufficient to cover such costs Reserve funds will be used to address those charges. If Reserve funds are used for such purpose(s), such funds will be released to you for disbursement less such amounts.
          - paragraph [ref=f59e236]: A variable reserve is a percentage, determined as appropriate by Etsy’s risk team, of a seller’s payment account balance (i) delayed prior to being included as part of a seller’s Available Funds for a period of up to 180 days or (ii) deducted from a seller's payment account as a reserve for a period of up to 90 days. A variable reserve may be placed on a seller’s payment account balance in addition to any applicable Fixed Reserve in Etsy’s sole discretion. Account Reserves are placed on an account on a case by case basis, in reference to the factors listed above and other risk-based criteria, and are reviewed from time to time. Etsy may deem a seller eligible for reduction in the percentage or removal of a Reserve due to a change in our risk-assessment of a seller based on the factors listed above, or as a result of a seller’s positive performance, such as a reduction in cases or an improvement in the seller’s fulfillment of orders. Etsy may increase the Reserve percentage held and/or the period for which the Reserve applies based on our re-review of a seller account against the factors listed above, and other risk-based criteria. If we change the terms of a Reserve due to a change in our risk assessment, we’ll notify you of the new terms.
          - paragraph [ref=f59e237]:
            - link "Here" [ref=f59e238] [cursor=pointer]:
              - /url: https://help.etsy.com/hc/en-gb/articles/360052804274
            - text: are some steps you can take to reduce the likelihood of having a Reserve applied to your account.
          - paragraph [ref=f59e239]:
            - strong [ref=f59e240]: Holds and Delays
            - text: . In some cases, deposits to a seller's bank accounts could be temporarily delayed by an issue at Etsy, Etsy’s third-party service providers, or a seller’s bank. We’ll do our best to communicate with any affected seller as soon as we can.
          - paragraph [ref=f59e241]: Separately, if we believe that a seller's actions may result in buyer disputes, chargebacks, increased risk of fraud, counterfeiting, or other claims, or if applicable law requires it, then we may, in addition to any applicable Reserve and in our sole discretion, put a hold or deposit delay on the seller’s payment account balance (and any accounts Etsy determines are related to your account).
          - list [ref=f59e242]:
            - listitem [ref=f59e243]:
              - text: A
              - strong [ref=f59e244]: hold
              - text: "may be put on funds associated with a particular transaction if there is a dispute or investigation related to the order, for the shorter of: (a) 180 days after the estimated delivery date, or (b) completion of any investigation regarding the seller’s actions."
            - listitem [ref=f59e245]:
              - strong [ref=f59e246]: Deposit delays
              - text: are defined as the number of days between a sale and the day the net amount from the sale becomes available for deposit, provided the payment has been completed. A deposit delay may be between 0 and 180 days. A deposit delay is applied across all transactions for a seller and the number of days is reflected in each seller’s payment account.
          - paragraph [ref=f59e247]: If Etsy places a hold or deposit delay on a seller’s account, we’ll do our best to communicate with the affected seller as appropriate as soon as we can.
          - paragraph [ref=f59e248]: We always work hard to avoid and minimize any delays. However, please note that Etsy is not obligated to refund any fees or reimburse any expenses due to holds or delayed deposits.
          - paragraph [ref=f59e249]:
            - strong [ref=f59e250]: C. Country and Currency Options.
            - text: "In the United States, Australia, Canada, the European Union, Hong Kong, Indonesia, Israel, Malaysia, Mexico, Morocco, New Zealand, Norway, Philippines, Singapore, South Africa, Switzerland, Türkiye, United Kingdom and Vietnam, Available Funds can only be deposited into bank accounts, in the domestic currency of the account, which includes the following currencies: US Dollars (USD), Australian Dollars (AUD), Canadian Dollars (CAD), Swiss Francs (CHF), Danish Krone (DKK), Euros (EUR), British Pounds (GBP), Hong Kong Dollars (HKD), Indonesian Rupiah (IDR), Israeli Shekel (ILS), Moroccan Dirham (MAD), Mexican Peso (MXN), Malaysian Ringgit (MYR), New Zealand Dollars (NZD), Norwegian Krone (NOK), Philippine Peso (PHP), Swedish Krona (SEK), Singapore Dollars (SGD), Turkish Lira (TRY), South African Rand (ZAR) and Vietnamese Dong (VND). In Argentina, Brazil, Chile, China, Egypt, Georgia, India, Japan, Kazakhstan, Pakistan, Peru, Serbia, South Korea, Thailand, United Arab Emirates, & Ukraine, funds will be deposited to your Payoneer Payment Account in United States Dollar (USD) and through Payoneer’s payment services you can subsequently withdraw to your local bank account in your local currency."
          - paragraph [ref=f59e251]:
            - strong [ref=f59e252]: D. Scheduled Deposits.
            - text: Etsy will instruct our payments partners to initiate a deposit of a seller’s Available Funds into the seller’s bank account on a daily, weekly, biweekly, or monthly basis. Sellers can select the frequency of disbursements from their payment account in their account settings. When a seller selects daily disbursements, disbursements will be made on each day that the seller's payment account has a balance equal to or greater than the minimum daily disbursement thresholds listed below. When a seller selects weekly, biweekly, or monthly disbursements, disbursements will be made on every applicable Monday. In this policy we'll refer to the date of disbursement as the "Payment Date." Deposits into a seller’s bank account will generally be credited within five (5) business days from the date Etsy initiates the deposit request. The actual timing of the deposit may depend on how quickly a seller’s bank processes the request. Notwithstanding the foregoing, disbursements for sellers using a Payoneer Payment Account will be made weekly on Mondays if a seller has a positive disbursement balance.
