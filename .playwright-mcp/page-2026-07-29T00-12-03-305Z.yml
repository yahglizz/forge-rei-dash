          - paragraph [ref=f59e357]: The Payment Date will fall on the next business day (Monday through Friday, excluding bank holidays) if the scheduled Payment Date falls on a non-business day. If a seller elects to change the frequency of disbursements, the following deposit will be initiated on the next business day if the seller selects daily disbursements, or on the next applicable Monday if the seller selects weekly, biweekly, or monthly disbursements. When a seller either initially provides or later changes their bank account information, the seller must wait at least five (5) calendar days to request a deposit into a bank account as a security precaution. The next scheduled deposit after a change to bank account information will occur on the next applicable Payment Date after a period of five (5) calendar days from the date of the requested change.
          - paragraph [ref=f59e358]:
            - strong [ref=f59e359]: E. Instant Transfer (US seller only)
            - text: . Eligible U.S sellers may use instant transfer to make transfers from their Etsy Payment account directly to their bank account, subject to a fee. Please note that if applicable, an instant transfer fee will be charged and displayed as part of the transfer process. Instant transfer is available 24/7, including on weekends and public holidays, and funds typically settle within 30 minutes. You can learn more about instant transfer in
            - link "this Help Article" [ref=f59e360] [cursor=pointer]:
              - /url: https://help.etsy.com/hc/articles/360046998234/01K7J6AHJNC3NR8WEA7QMXT87H?segment=selling#h_01K7J6828G5CNVVYAZ2G7BQHHP
            - text: .
          - paragraph [ref=f59e361]:
            - strong [ref=f59e362]: F. Escheatment.
            - text: If Etsy cannot settle funds into a seller’s bank account, or the seller is refused service by Etsy under Etsy’s Terms of Use, the funds will remain with Etsy and the balance remains available in the seller’s payment account. It is the seller’s sole responsibility to update their bank account information to receive the funds, if applicable. If a seller fails to update the information to claim the funds within a certain period of time, or Etsy cannot release funds to the seller for compliance reasons, Etsy will escheat the funds to the relevant government authority as required in order to comply with applicable escheatment laws.
          - heading "8. Recoupment" [level=2] [ref=f59e363]
          - paragraph [ref=f59e364]:
            - strong [ref=f59e365]: A.
            - text: "We reserve the right, in our sole discretion, to seek reimbursement from a seller (and any accounts Etsy determines are related to your account) in any of the following circumstances: (a) we provide a refund to a buyer because a seller did not promptly deliver the goods or we otherwise determine, consistent with Section 5"
            - link "Seller Rights and Responsibilities" [ref=f59e366] [cursor=pointer]:
              - /url: https://www.etsy.com/legal/etsy-payments/#etsy
            - text: ", that a refund is warranted in a particular circumstance, (b) we discover erroneous or duplicate transactions related to a seller, (c) we receive a chargeback from a buyer's credit card issuer or reversal of payment for the amount of a buyer's purchase from a seller, or (d) a seller does not act in accordance with Etsy’s policies."
          - paragraph [ref=f59e367]:
            - strong [ref=f59e368]: B
            - text: . We may obtain reimbursement of any amounts owed by a seller to Etsy by deducting from future payments owed to the seller, reversing any credits to the seller’s payment account balance, charging the seller's card on file, charging the seller’s payment account (and any accounts Etsy determines are related to your account), or seeking reimbursement from the seller by any other lawful means, including by using third-party collections services. You authorize us to use any or all of the foregoing methods to seek reimbursement. Etsy may suspend your selling privileges at any time pending payment of your outstanding balance.
          - heading "9. Payment Processing Fees" [level=2] [ref=f59e369]
          - paragraph [ref=f59e370]:
            - strong [ref=f59e371]: A. Overview.
            - text: "Etsy charges a fee (the “Payment Processing Fee”) for each transaction processed through Etsy Payments. The fee amount will be assessed on the gross order amount, including shipping and tax (if applicable). Payment Processing Fees will be reflected in your payment account and will be deducted from the total amount of the payment at the time the payment is considered complete. We reserve the right to modify the Payment Processing Fee at any time. For deposits below designated thresholds in certain markets, a deposit fee will apply, as described in the table below. Deposit fees are deducted from your Available Funds and reflected in your payment account at the time of your scheduled deposit. In the event of any partial or full refunds credited back to a buyer by a seller, the Payment Processing Fee and other applicable fees will be recalculated based on the adjusted sale price. The difference between the original Payment Processing Fee and the adjusted Payment Processing Fee will be applied to the refund amount being credited back to the seller. Other applicable fees will be refunded to the seller's payment account. Deposit fees will be refunded if the deposit is returned to a seller’s payment account. For clarity, for full refunds credited back to a buyer that are covered by Etsy (e.g., through Etsy’s Protection Program), the Payment Processing Fee and other applicable fees (including without limitation: transaction fee, offsite ads fee, etc.) will not be credited back to the seller."
          - paragraph [ref=f59e372]:
