          - heading "Etsy Payments Policy" [level=1] [ref=f59e97]
        - paragraph [ref=f59e99]: Etsy Payments allows sellers to accept various forms of payments on Etsy.com, and Etsy's mobile apps and other services. Etsy Payments users can accept payment from buyers by credit card, debit card, Etsy Gift Card, Etsy Credit, Etsy Coupon, some bank transfer services, PayPal (where available), Pay by Bank, Apple Pay, Google Pay, and some country-specific installment payment methods - all in their domestic Etsy Payments currencies. In order to use Etsy Payments, and as further detailed in this Policy, you consent to store a debit or credit card on file, and you expressly authorize Etsy to charge such card for any amounts owed to Etsy if there are insufficient funds in your account. This policy explains all of your rights and obligations when using Etsy Payments.
