              - paragraph [ref=f87e87]:
                - generic [ref=f87e88]:
                  - text: If you have an
                  - link [ref=f87e89] [cursor=pointer]:
                    - /url: https://help.etsy.com/hc/articles/115015747228?segment=selling#h_288f3de0-6225-4f9a-bf45-af4364210440
                    - strong [ref=f87e90]: Amount due
                  - text: ", you can select"
                - strong [ref=f87e91]: Pay now
                - text: ", or use auto-billing if you’re in the US."
              - heading [level=2] [ref=f87e92]:
                - strong [ref=f87e93]: Listing Fees
              - paragraph [ref=f87e94]:
                - text: When you add a product to your Etsy shop, we call this a
                - link "listing" [ref=f87e95] [cursor=pointer]:
                  - /url: https://help.etsy.com/hc/articles/115015628707?segment=selling
                - text: . Listing fees are the fees you pay to list products for sale on Etsy. You’ll be charged a listing fee for each individual listing you post.
              - paragraph [ref=f87e96]: The listing fee is a flat rate charge of $0.20 USD per listing. This fee is charged regardless of whether or not the item listed sells. The fee is automatically added to your payment account when you publish an item.
              - paragraph [ref=f87e97]:
                - generic [ref=f87e98]:
                  - text: Other types of listing fees include
                  - link "auto-renew sold" [ref=f87e99] [cursor=pointer]:
                    - /url: https://help.etsy.com/hc/en-us/articles/360035902374-Etsy-Fee-Basics?segment=selling#h_4db30fc0-377b-41ac-ac30-74ee90296994
                  - text: ","
                  - link "multi-quantity" [ref=f87e100] [cursor=pointer]:
                    - /url: https://help.etsy.com/hc/en-us/articles/360035902374-Etsy-Fee-Basics?segment=selling#h_a67f1991-1a8a-4e5f-8770-7844b06f7fe1
                  - text: ", and"
                  - link "custom listing" [ref=f87e101] [cursor=pointer]:
                    - /url: https://help.etsy.com/hc/en-us/articles/360035902374-Etsy-Fee-Basics?segment=selling#h_5e7b4dbb-14d8-484f-97f3-9499eaf12950
                  - text: fees.
              - heading [level=3] [ref=f87e102]:
                - strong [ref=f87e103]: Auto-renew sold fees
              - paragraph [ref=f87e104]: Auto-renewed listings automatically repost a listing if it’s purchased from your shop, saving you the time of manually reposting products. If you setup a listing to auto-renew and it’s purchased, you’ll be charged the standard $0.20 USD listing fee.
              - heading [level=3] [ref=f87e105]:
                - strong [ref=f87e106]: Multi-quantity listing fees
              - paragraph [ref=f87e107]: If you have variations of an item for sale in a single listing and a customer purchases more than one variation, you’ll also be charged the standard $0.20 USD listing fee for each additional item purchased from the listing. The additional charges won’t post until a multi-quantity purchase has been made.
              - paragraph [ref=f87e108]: For example, if you had more than one item in stock for a particular listing, and a customer purchases two different variations of that item, your payment account would reflect the original $0.20 USD listing fee plus an additional $0.20 USD for the additional item purchased.
              - paragraph [ref=f87e109]:
                - generic [ref=f87e110]:
                  - link "Learn more about multi-quantity listing fees" [ref=f87e111] [cursor=pointer]:
                    - /url: https://help.etsy.com/hc/articles/360000344908?segment=selling
                  - text: .
              - heading [level=3] [ref=f87e112]:
                - strong [ref=f87e113]: Custom listing fees
              - paragraph [ref=f87e114]:
                - generic [ref=f87e115]:
                  - link "Custom listings" [ref=f87e116] [cursor=pointer]:
                    - /url: https://help.etsy.com/hc/articles/115015663107?segment=selling
                  - text: are useful when you want to post a particular product for a private sale to a particular buyer. Custom listing fees cost the $0.20 USD standard fee.
              - heading [level=2] [ref=f87e117]:
                - strong [ref=f87e118]: Transaction fees
              - paragraph [ref=f87e119]: Transaction fees are the fees Etsy collects when a customer makes a purchase from your shop. Unlike listing fees, transaction fees are only collected on listings that sell.
              - paragraph [ref=f87e120]: "Transaction fee basics:"
              - list [ref=f87e121]:
                - listitem [ref=f87e122]: Etsy charges 6.5% of the total order amount in your designated listing currency.
                - listitem [ref=f87e123]: This fee applies to the total cost of the item, along with shipping and gift wrap (if you charge your customers for those). You will see the charges itemized separately on your Payment account.
                - listitem [ref=f87e124]:
                  - generic [ref=f87e125]: The transaction fee amount posts automatically to your Payment account.
              - heading [level=2] [ref=f87e126]:
                - strong [ref=f87e127]: Payment processing fees
              - paragraph [ref=f87e128]:
                - generic [ref=f87e129]:
                  - link "Payment processing fees" [ref=f87e130] [cursor=pointer]:
                    - /url: https://help.etsy.com/hc/articles/115015628847?segment=selling
                  - text: are a set rate plus a percent of the total sale price of the item. This rate and percent vary by country. The fees are taken from the item’s total sale price, including its shipping fees, and any applicable sales tax.
              - paragraph [ref=f87e131]: Payment processing fees are charged on each transaction that uses Etsy Payments. These processing fees appear in your payment account and are deducted prior to deposit. They are in addition to Etsy's transaction fees.
              - paragraph [ref=f87e132]:
                - link "Learn more about payment processing fees" [ref=f87e133] [cursor=pointer]:
                  - /url: https://help.etsy.com/hc/articles/115015628847?segment=selling
                - text: .
