            - heading "Etsy Fee Basics" [level=1] [ref=f87e57]
            - generic [ref=f87e59]:
              - paragraph [ref=f87e60]: When you sell on Etsy, there are a few fees related to listing and selling an item.
              - paragraph [ref=f87e61]: "The fees most sellers will need to know are:"
              - list [ref=f87e62]:
                - listitem [ref=f87e63]:
                  - link "Listing fees" [ref=f87e64] [cursor=pointer]:
                    - /url: https://help.etsy.com/hc/en-us/articles/360035902374-Etsy-Fee-Basics?segment=selling#h_7304ad2b-b372-4889-93cf-482bffa6cf1b
                - listitem [ref=f87e65]:
                  - link "Transaction fees" [ref=f87e66] [cursor=pointer]:
                    - /url: https://help.etsy.com/hc/en-us/articles/360035902374-Etsy-Fee-Basics?segment=selling#h_f1fa1f59-0513-4ad8-9c7b-25543be34eff
                - listitem [ref=f87e67]:
                  - link "Payment processing fees" [ref=f87e69] [cursor=pointer]:
                    - /url: https://help.etsy.com/hc/en-us/articles/360035902374-Etsy-Fee-Basics?segment=selling#h_ac38ddad-c7ec-4103-92a4-7709b3a9d73f
              - paragraph [ref=f87e70]:
                - generic [ref=f87e71]:
                  - text: If you use Etsy tools such as
                  - link "Etsy Ads" [ref=f87e72] [cursor=pointer]:
                    - /url: https://help.etsy.com/hc/articles/360033701174?segment=selling
                  - text: or
                  - link "Offsite Ads" [ref=f87e73] [cursor=pointer]:
                    - /url: https://help.etsy.com/hc/articles/360000338367?segment=selling
                  - text: ", or if you purchase shipping labels on Etsy, there are additional fees associated with those services."
                - link "Learn more about fees and taxes for selling on Etsy." [ref=f87e74] [cursor=pointer]:
                  - /url: https://help.etsy.com/hc/en-us/articles/115014483627-What-are-the-Fees-and-Taxes-for-Selling-on-Etsy-?segment=selling#listing
              - paragraph [ref=f87e75]:
                - generic [ref=f87e76]:
                  - text: To view your
                  - link "Payment account" [ref=f87e77] [cursor=pointer]:
                    - /url: https://help.etsy.com/hc/articles/115015747228?segment=selling
