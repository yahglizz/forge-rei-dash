          - heading "Listing Image Requirements" [level=1] [ref=f90e97]
        - article [ref=f90e98]:
          - paragraph [ref=f90e99]:
            - text: The Etsy marketplace is built on trust and transparency. That's why we require sellers to use original photos of the actual product buyers will receive, not renderings or stock photos, except in the situations outlined below. By uploading images, you confirm that you have all necessary rights to those photos and are complying with our
            - link "Intellectual Property Policy" [ref=f90e100] [cursor=pointer]:
              - /url: https://www.etsy.com/legal/ip
            - text: and the content policies described in our
            - link "Prohibited Items Policy" [ref=f90e101] [cursor=pointer]:
              - /url: https://www.etsy.com/legal/prohibited/
            - text: .
          - heading "Use original photos" [level=2] [ref=f90e102]
          - paragraph [ref=f90e103]: When creating your listings, you must use your own photos—either photos you took yourself or had someone take for you. These photos should showcase the actual finished product that you made, designed, handpicked, or sourced. By accurately portraying the condition, quality, and quantity of your items, you help build trust with buyers.
          - heading "Exceptions" [level=2] [ref=f90e104]
          - paragraph [ref=f90e105]: In certain situations, using original photos of the exact item may not be possible. You can use stock photos in some limited circumstances, where you are offering either personalized/customized items or an item made with a production partner, as discussed below.
          - heading "Photos of personalized or customized items" [level=3] [ref=f90e106]
          - paragraph [ref=f90e107]: For personalized or customized items (e.g. custom drawings, monogrammed accessories, or t-shirts featuring a buyer’s custom text), your first image must feature a finished, customized item similar to what buyers will receive. This helps buyers visualize what their custom-made item will look like when completed. It is prohibited to use a photo of the blank product or a mockup with placeholder text (e.g. “Your Text Here”) as the main image.
          - paragraph [ref=f90e108]: Computer-generated mockups may be used in additional listing images to showcase customization options – just make sure your first image is the real deal. If you would like to use a buyer’s review photo as a listing image, you need permission from the buyer.
          - heading "Photos of items made with production partners" [level=3] [ref=f90e109]
          - paragraph [ref=f90e110]: "When working with production partners, the requirements for listing photos vary depending on the item: If you design a unique item (such as a piece of furniture, clothing, or a book) and a production partner manufactures it for you, use a real photo of the physical end product. If you create an original design (such as artwork or a pattern) that a production partner prints onto a base item (like a t-shirt or mug), you may use a stock photo mockup to illustrate the end product buyers will receive. Buyer-personalized items must follow the guidelines in the “Personalized or Customized” section above."
          - paragraph [ref=f90e111]: Last updated on Jul 9, 2024
