        - generic [ref=f49e95]:
          - generic [ref=f49e96]: Want to open your own Etsy shop? Create your shop today!
          - generic [ref=f49e97]:
            - link "Learn more" [ref=f49e98] [cursor=pointer]:
              - /url: /sell?ref-seller-handbook=seller-handbook-learn-more
            - link "Create your shop" [ref=f49e99] [cursor=pointer]:
              - /url: /your/shop/create?ref-seller-handbook=seller-handbook-open-shop-logged-in
        - generic [ref=f49e102]:
          - generic [ref=f49e103]:
            - paragraph [ref=f49e104]: At Etsy, we strive to support our creative community while embracing technological innovation in the arts. We recognize that many tools used by our sellers today, such as photo editing software, increasingly include AI capabilities that can enhance the creative process and open new artistic possibilities. When artists use these AI tools, they still make creative decisions and contributions to guide the AI and carefully curate the output to produce unique, finished works for sale.
            - heading "Seller-prompted AI creations" [level=2] [ref=f49e105]
            - paragraph [ref=f49e106]: After carefully considering the complex issues surrounding AI-generated content, we have decided to continue to allow sellers to use their original prompts in combination with AI tools to create the artwork they sell on Etsy. Permitted examples of this might include a fantasy scene based on a seller’s original prompt or inputs and produced by an AI generator, or a custom portrait of a buyer’s pet generated using AI tools. Sellers must disclose within their listing description if an item is created with the use of AI.
            - paragraph [ref=f49e107]: We believe this decision aligns with our values of supporting artists through the evolution of art. However, we also understand there are important ongoing conversations regarding the training of AI models, including ethical questions about the use of copyrighted works and concerns about mitigating bias and negative environmental impacts.
            - paragraph [ref=f49e108]: As such, we will be closely monitoring developments in this rapidly-evolving area, listening to feedback from our community, and periodically reevaluating our policies. We are committed to striking the right balance between enabling our sellers to leverage new creative tools and technologies, while ensuring that Etsy remains a marketplace known for its original items from real people. Maintaining the trust of both our sellers and buyers will always be our top priority.
            - heading "AI prompt bundles" [level=2] [ref=f49e109]
            - paragraph [ref=f49e110]: While we allow the use of AI tools in the creative process, we prohibit the sale of AI prompt bundles on our platform. We believe that the prompts used to generate AI artwork are an integral part of the creative process and should not be sold separately from the final artwork. Selling prompt bundles without the accompanying finished artwork undermines the value of the artist's creative input and curation, which are essential to the creation of the unique, creative items that Etsy is known for.
            - heading "Nudity and sexual content" [level=2] [ref=f49e111]
            - paragraph [ref=f49e112]:
              - text: Any AI-generated depictions of nudity and sexual content must follow the rules and restrictions outlined by our
              - link "Prohibited Items Policy" [ref=f49e113] [cursor=pointer]:
                - /url: https://www.etsy.com/legal/prohibited/?ref=list
              - text: . Also note that we prohibit content which infringes on the privacy, publicity, and personal rights of others.
