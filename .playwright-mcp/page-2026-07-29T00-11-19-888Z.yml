          - heading "Seller Policy" [level=1] [ref=f33e97]
        - paragraph [ref=f33e99]: Etsy is a marketplace where you can sell the items you've made, designed, and handpicked, or sourced, directly to buyers around the world. We want to make sure that you and your buyers have a positive experience on Etsy. Please read on to find out more about your rights, as well as what is expected of you, as a seller.
        - article [ref=f33e100]:
          - paragraph [ref=f33e101]:
            - text: This policy is effective on July 9, 2026. Click
            - link "here" [ref=f33e102] [cursor=pointer]:
              - /url: https://www.etsy.com/legal/policy/seller-policy-effective-through-july-8/1489086421092
            - text: to view the version of this policy that is effective through and until July 8, 2026.
          - paragraph [ref=f33e103]:
            - text: This policy is a part of our
            - link "Terms of Use" [ref=f33e104] [cursor=pointer]:
              - /url: https://www.etsy.com/legal/terms
            - text: . By opening an Etsy shop, you’re agreeing to this policy and our Terms of Use
          - list [ref=f33e105]:
            - listitem [ref=f33e106]:
              - paragraph [ref=f33e107]:
                - link "Selling Basics" [ref=f33e108] [cursor=pointer]:
                  - /url: "#selling"
                - text: a. What can be sold on Etsy b. What can't be sold on Etsy c. Managing your Etsy shop d. Seller Standards e. Selling Fees
            - listitem [ref=f33e109]:
              - paragraph [ref=f33e110]:
                - link "Being a Member of the Etsy Community" [ref=f33e111] [cursor=pointer]:
                  - /url: "#community"
                - text: a. Creating and Uploading Content b. Privacy and Protecting Personal Information c. Communication Standards i. Messages ii. Forums/Teams iii. Communicating Cancellations
            - listitem [ref=f33e112]:
              - link "Feedback, Cases, and Your Success" [ref=f33e113] [cursor=pointer]:
                - /url: "#success"
              - text: a. Reviews b. Etsy’s Case System c. Etsy's Purchase Protection Program for Sellers d. Your Seller Account and Etsy’s Terms
          - heading "1. Selling Basics" [level=2] [ref=f33e114]
          - paragraph [ref=f33e115]: Keeping in mind these basic requirements will set you up for success on Etsy.
          - paragraph [ref=f33e116]:
            - strong [ref=f33e117]: a. What can be sold on Etsy
          - paragraph [ref=f33e118]: Etsy is a unique marketplace. Buyers come here to purchase items that they might not find anywhere else, or to spark their own creativity. As such, everything listed for sale on Etsy must be made, designed, handpicked, or sourced by a seller.
          - paragraph [ref=f33e119]:
            - text: To learn about what items are allowed on Etsy, review Read about Etsy’s Creativity Standards
            - link "here" [ref=f33e120] [cursor=pointer]:
              - /url: https://www.etsy.com/legal/creativity
            - text: .
          - paragraph [ref=f33e121]: "If you sell on Etsy, you need to provide the following information for each of your items:"
          - list [ref=f33e122]:
            - listitem [ref=f33e123]: An accurate representation of how the item was made, by whom, and where it is being shipped from.
            - listitem [ref=f33e124]:
              - text: An accurate description of any
              - link "shop members" [ref=f33e125] [cursor=pointer]:
                - /url: https://help.etsy.com/hc/en-us/articles/360000336867-Roles-for-Shop-Members?segment=selling
              - text: who are involved in making your items or running your business in the
              - link "About section" [ref=f33e126] [cursor=pointer]:
                - /url: https://help.etsy.com/hc/en-us/articles/115015628487-How-to-Edit-Your-Shop-s-About-Section?segment=selling
              - text: of your shop.
            - listitem [ref=f33e127]:
              - text: If you work with a production partner, you must disclose that production partner in your relevant listings. Read more about
              - link "working with production partners" [ref=f33e128] [cursor=pointer]:
                - /url: https://help.etsy.com/hc/en-us/articles/360000336547-Working-with-Production-Partners-on-Etsy?segment=selling
              - text: .
            - listitem [ref=f33e129]:
              - text: Your own photographs or video content —not stock photos, artistic renderings, or photos used by other sellers or sites. Read more about
              - link "listing image requirements" [ref=f33e130] [cursor=pointer]:
                - /url: https://www.etsy.com/legal/policy/listing-image-requirements/253962679005
              - text: ", including limited exceptions for custom items and items made with production partner assistance."
            - listitem [ref=f33e131]:
              - text: If an item is created through the use of artificial intelligence, you must disclose this in your relevant listings. Read more about our stance on AI creations
              - link "here" [ref=f33e132] [cursor=pointer]:
                - /url: https://www.etsy.com/seller-handbook/article/1275449912004
              - text: .
          - paragraph [ref=f33e133]:
            - text: For information on how to list personalized items, please see
            - link "this Help article" [ref=f33e134] [cursor=pointer]:
              - /url: https://help.etsy.com/hc/articles/360000344528
            - text: .
          - paragraph [ref=f33e135]:
            - text: We encourage you to be transparent about how your craft and party supplies were made and where your materials come from. You can disclose whether your items have social or environmental attributes, such as
            - link "organic" [ref=f33e136] [cursor=pointer]:
              - /url: https://www.etsy.com/legal/policy/organic-materials/242696248617
            - text: or
            - link "recycled" [ref=f33e137] [cursor=pointer]:
              - /url: https://www.etsy.com/legal/policy/recycled-content/239326729662
            - text: . You can also select the
            - link "location of manufacture" [ref=f33e138] [cursor=pointer]:
              - /url: https://help.etsy.com/hc/articles/360000345008
            - text: . Learn more
            - link "here" [ref=f33e139] [cursor=pointer]:
              - /url: https://help.etsy.com/hc/articles/360000343608
            - text: .
          - paragraph [ref=f33e140]:
            - strong [ref=f33e141]: b. What Can't be Sold on Etsy
          - paragraph [ref=f33e142]:
            - text: Even if they otherwise meet our marketplace criteria,
            - link "prohibited items" [ref=f33e143] [cursor=pointer]:
              - /url: https://www.etsy.com/legal/prohibited
            - text: ","
            - link "services" [ref=f33e144] [cursor=pointer]:
              - /url: https://www.etsy.com/legal/policy/services/242665313101
            - text: ", and"
            - link "items that violate our intellectual property policies" [ref=f33e145] [cursor=pointer]:
              - /url: https://www.etsy.com/legal/ip
            - text: are not allowed to be sold on Etsy.
          - paragraph [ref=f33e146]:
            - text: All listings must offer an item for sale (which includes digitally delivered items, and can also include reserved listings for custom items). You may not create an Etsy listing for the purpose of sharing a referral code, posting a want ad,
            - link "crowdfunding" [ref=f33e147] [cursor=pointer]:
              - /url: https://www.etsy.com/legal/policy/donating-shop-proceeds-to-charity/239327254340
            - text: ", or similar activity that does not offer a physical or digital item for sale. Where a seller needs to collect additional payment from a buyer after checkout reflecting the final price of the item, where the total price could not be determined at the time of the original listing for bespoke or highly customized orders, sellers must use"
            - link "Etsy's \"Create Custom Order\" feature" [ref=f33e148] [cursor=pointer]:
              - /url: https://help.etsy.com/hc/en-us/articles/115015663107-How-to-Offer-Custom-Items?segment=selling
            - text: . Etsy sellers also may not offer gift cards for their shops. Gift cards used on Etsy may only be purchased from Etsy directly. Read more about our
            - link "Etsy Gift Cards, Credits & Coupons Policy" [ref=f33e149] [cursor=pointer]:
              - /url: https://www.etsy.com/legal/gift-cards/?ref=list#shop-cards
            - text: .
          - paragraph [ref=f33e150]:
            - text: Dropshipping and reselling are not allowed on Etsy, except in the specific cases outlined in
            - link "this Help article" [ref=f33e151] [cursor=pointer]:
              - /url: https://help.etsy.com/hc/articles/23948763872151
            - text: ", such as craft supplies."
          - paragraph [ref=f33e152]:
            - text: Etsy may remove any listings that violate our policies. We use a combination of automated systems, manual monitoring and flags from members and third parties to help us identify items that may violate our policies. Note that listing fees are non-refundable. Etsy may also suspend or terminate your account for any violations and you'll still have to pay any outstanding fees on your Etsy statement. You can find more information in our
            - link "Fees & Payments Policy" [ref=f33e153] [cursor=pointer]:
              - /url: https://www.etsy.com/legal/fees/
            - text: .
          - paragraph [ref=f33e154]:
            - text: Please see
            - link "this Help article" [ref=f33e155] [cursor=pointer]:
              - /url: https://www.etsy.com/legal/policy/donating-shop-proceeds-to-charity/239327254340
            - text: for information about donating any portion of your sales to charity.
          - paragraph [ref=f33e156]:
            - strong [ref=f33e157]: c. Managing your Etsy Shop
          - paragraph [ref=f33e158]: Your shop represents you and your business to the Etsy community. It’s important that you, your items and your shop are honestly and accurately represented.
          - paragraph [ref=f33e159]: "By selling on Etsy, you agree that you will:"
          - list [ref=f33e160]:
            - listitem [ref=f33e161]:
              - text: Provide honest, accurate information to Etsy and in your
              - link "About section" [ref=f33e162] [cursor=pointer]:
                - /url: https://help.etsy.com/hc/articles/115015628487
              - text: .
            - listitem [ref=f33e163]:
              - text: Honor your
              - link "Shop Policies" [ref=f33e164] [cursor=pointer]:
                - /url: https://help.etsy.com/hc/articles/115014372467
              - text: .
            - listitem [ref=f33e165]:
              - text: Ensure your shop content, such as any text, photos or videos used to represent yourself, your shop or your listings, abide by Etsy’s policies, including our
              - link "Discrimination and Hateful Content Policy" [ref=f33e166] [cursor=pointer]:
                - /url: https://www.etsy.com/legal/policy/discrimination-and-hateful-content/123551108902
              - text: .
            - listitem [ref=f33e167]:
              - text: Accurately represent your items, including any details you provide about country of origin, provenance, attributes, components or materials, in
              - link "listings" [ref=f33e168] [cursor=pointer]:
                - /url: https://help.etsy.com/hc/articles/115015628707
              - text: and listing photos.
            - listitem [ref=f33e169]:
              - text: Respect the
              - link "intellectual property" [ref=f33e170] [cursor=pointer]:
                - /url: https://www.etsy.com/legal/ip
              - text: of others. If you feel someone has violated your intellectual property rights,
              - link "you can report it to Etsy" [ref=f33e171] [cursor=pointer]:
                - /url: https://help.etsy.com/hc/en-us/articles/360000344448-How-to-File-a-Notice-of-Intellectual-Property-Infringement
              - text: .
            - listitem [ref=f33e172]:
              - text: Not facilitate
              - link "off-platform transactions" [ref=f33e173] [cursor=pointer]:
                - /url: https://www.etsy.com/legal/policy/off-platform-transactions/1254654515806
              - text: .
            - listitem [ref=f33e174]: Not create duplicate shops or take any other action (such as manipulating clicks, carts or sales) for the purpose of shilling, manipulating search or circumventing Etsy's policies.
            - listitem [ref=f33e175]: Not coordinate pricing with other sellers.
            - listitem [ref=f33e176]: Ensure that any orders shipped to the United States are sent using a Delivery Duty Paid (DDP) shipping method, and not take any action (including use of Delivery Duty Unpaid (DDU) shipping) that would result in buyers being charged additional fees after purchase.
          - paragraph [ref=f33e177]:
            - strong [ref=f33e178]: d. Seller Standards
            - text: By listing a product for sale on Etsy you understand and agree that you are responsible for complying with all applicable laws and regulations for the products you list for sale, including any required labels and warnings. Etsy assumes no responsibility for the accuracy, labeling, or content of your listings or any information you provide, either directly or through Etsy to shipping carriers or customs authorities.
          - paragraph [ref=f33e179]: Meeting Service Level Standards
          - paragraph [ref=f33e180]:
            - text: As a seller, you must provide great customer service and maintain trust with your buyers. These requirements are called our Seller Service Level Standards. Etsy may reach out to you if your shop fails to meet Etsy's Seller Service Level Standards. Read more
            - link "here" [ref=f33e181] [cursor=pointer]:
              - /url: https://help.etsy.com/hc/articles/360000345068
            - text: .
          - paragraph [ref=f33e182]: "By selling on Etsy, you agree to:"
          - list [ref=f33e183]:
            - listitem [ref=f33e184]:
              - text: Honor your shipping and processing times. Sellers are obligated to ship an item or otherwise complete a transaction with a buyer in a prompt manner, unless there is an exceptional circumstance. Please be aware that legal requirements for shipping times vary by country. Read more in our
              - link "Shipping Policy" [ref=f33e185] [cursor=pointer]:
                - /url: https://www.etsy.com/legal/shipping/?ref=list
              - text: .
            - listitem [ref=f33e186]: Respond to Messages in a timely manner.
            - listitem [ref=f33e187]: Honor the commitments you make in your shop policies.
            - listitem [ref=f33e188]: Resolve disagreements or order issues directly with the buyer. In the unlikely event that you can’t reach a resolution, Etsy can help through our case system.
            - listitem [ref=f33e189]:
              - text: If you are unable to complete an order, you must notify the buyer and cancel the order. Read about how to cancel an order in this
              - link "Help" [ref=f33e190] [cursor=pointer]:
                - /url: https://help.etsy.com/hc/en-us/articles/115015521728-How-to-Cancel-an-Order?segment=shopping
              - text: article.
            - listitem [ref=f33e191]:
              - text: Be honest in your pricing and promotions. Sales, discounts, and price comparisons must reflect real, accurate pricing and comply with the laws where you sell. Promotions should not mislead buyers about the value or timing of a deal. Learn more in our guidance on truthful advertising, sales and discounts
              - link "here" [ref=f33e192] [cursor=pointer]:
                - /url: https://www.etsy.com/seller-handbook/article/1450964704111
              - text: .
          - paragraph [ref=f33e193]:
            - strong [ref=f33e194]: e. Selling Fees
          - paragraph [ref=f33e195]:
            - text: Sellers may be charged for using some of Etsy’s services. There are fees associated with listing, selling, advertising, and certain other Etsy products and features. You can find information on fees in the
            - link "Fees and Payments Policy" [ref=f33e196] [cursor=pointer]:
              - /url: https://www.etsy.com/ie/legal/fees
            - text: .
          - heading "2. Being a Member of the Etsy Community" [level=2] [ref=f33e197]
          - paragraph [ref=f33e198]: At Etsy, everyone is expected to treat fellow members of the Etsy community with respect. As a seller, you have additional responsibilities to safeguard personal information and communicate promptly with buyers in order to provide a great customer experience.
          - paragraph [ref=f33e199]:
            - strong [ref=f33e200]: a. Creating and Uploading Content
          - paragraph [ref=f33e201]: "As a member of Etsy, you have the opportunity to create and upload a variety of content, like listings, Messages, text, photos, and videos. In order to keep our community safe and respectful, you agree that you will not upload content that:"
          - list [ref=f33e202]:
            - listitem [ref=f33e203]:
              - text: Contains hateful or derogatory language or imagery, or any content that is subject to our
              - link "Discrimination and Hateful Content Policy" [ref=f33e204] [cursor=pointer]:
                - /url: https://www.etsy.com/legal/policy/discrimination-and-hateful-content/123551108902
              - text: ;
            - listitem [ref=f33e205]:
              - text: Contains threats, harassment,
              - link "extortion" [ref=f33e206] [cursor=pointer]:
                - /url: https://www.etsy.com/legal/policy/extortion/239966959186
              - text: ", or violates our rules about interference;"
            - listitem [ref=f33e207]: Violates someone else’s intellectual property rights;
            - listitem [ref=f33e208]: Is false, deceptive, or misleading;
            - listitem [ref=f33e209]: Contains unsolicited advertising or promotions, requests for donations, or spam;
            - listitem [ref=f33e210]: Contains private information, whether it is your own, or someone else’s;
            - listitem [ref=f33e211]:
              - text: Encourages or facilitates an
              - link "off-platform transaction" [ref=f33e212] [cursor=pointer]:
                - /url: https://www.etsy.com/legal/policy/off-platform-transactions/1254654515806
              - text: ;
            - listitem [ref=f33e213]: Contains prohibited medical drug claims;
            - listitem [ref=f33e214]: Sexualizes minors under the age of 18;
            - listitem [ref=f33e215]:
              - text: Violates any of the rules described in our
              - link "Prohibited Items Policy" [ref=f33e216] [cursor=pointer]:
                - /url: https://www.etsy.com/legal/prohibited/
              - text: .
          - paragraph [ref=f33e217]: Members may not use Etsy services such as Messages, Favorites, or Collections to make inappropriate use of otherwise compliant content, whether overtly or through contextualization. This includes, for example, the aggregation of content with the intent of sexualizing minors.
          - paragraph [ref=f33e218]: Some content on Etsy is subject to additional requirements. Please see below for more details.
          - paragraph [ref=f33e219]:
            - text: Read more about how Etsy search works, what factors impact search ranking, and how you can help optimize your listings and shop
            - link "here" [ref=f33e220] [cursor=pointer]:
              - /url: https://www.etsy.com/legal/policy/search-advertisement-ranking-disclosures/899478564529
            - text: and in The
            - link "Ultimate Guide to Etsy Search" [ref=f33e221] [cursor=pointer]:
              - /url: https://www.etsy.com/seller-handbook/article/the-ultimate-guide-to-etsy-search/366469415790
            - text: .
          - paragraph [ref=f33e222]:
            - strong [ref=f33e223]: b. Privacy and Protecting Personal Information
          - paragraph [ref=f33e224]:
            - text: You are responsible for protecting members’ personal information you receive or process, and you must comply with all relevant legal requirements. This includes applicable data protection and privacy laws that govern the ways in which you can use Etsy user information. These laws may require that you post and comply with your own privacy policy, which must be accessible to Etsy users with whom you interact. Your privacy policy must be compatible with this policy and Etsy’s
            - link "Terms of Use" [ref=f33e225] [cursor=pointer]:
              - /url: https://www.etsy.com/legal/terms-of-use
            - text: ", and Etsy's"
            - link "Privacy Policy" [ref=f33e226] [cursor=pointer]:
              - /url: https://www.etsy.com/legal/privacy/?ref=list
            - text: .
          - paragraph [ref=f33e227]:
            - text: In particular, when you sell using our Services (subject to this Policy) or use Etsy’s API (also subject to the
            - link "Etsy API Terms of Use" [ref=f33e228] [cursor=pointer]:
              - /url: https://www.etsy.com/legal/api
            - text: ), you may receive and determine what to do with certain personal information, such as when communicating with users and entering into transactions with buyers. This means you process personal information (for example, buyer name, email address, and shipping address) and, to the extent you do so, under EU law, you are an independent controller of data relating to other users that you may have obtained through the Services. For more information on the General Data Protection Regulation, see more resources at https://gdpr-info.eu and http://gdprandyou.ie. As a data controller (that is someone who decides what personal data is collected and the purpose you’ll use the data for) to the extent that you process user personal information outside of the Services, you may be required under applicable data protection and privacy laws to honor requests received from such users for data access, portability, correction, deletion, and objections to processing. Also, if you disclose personal information without the buyer’s proper consent, you are responsible for that unauthorized disclosure. This includes, for example, disclosures you make or unintentional data breaches. For example, you may receive a buyer’s email address or other information as a result of entering into a transaction with that buyer. This information may only be used for Etsy-related communications or for Etsy-facilitated transactions. You may not use this information for unsolicited commercial messages or unauthorized transactions. Without the buyer’s consent, and subject to other applicable Etsy policies and laws, you may not add any Etsy member to your email or physical mailing list, use that buyer’s identity for marketing, or obtain or retain any payment information. Please bear in mind that you're responsible for knowing the standard of consent required in any given instance. If Etsy and you are found to be joint data controllers of personal information, and if Etsy is sued, fined, or otherwise incurs expenses because of something that you did in your capacity as a joint data controller of buyer personal information, you agree to indemnify, defend and hold Etsy (and its employees, agents, consultants, subsidiaries, partners, affiliates, and licensors) harmless against any claims, costs, losses, damages, liabilities, judgements and expenses (including reasonable attorney fees) in connection with your processing of buyer personal information.
          - paragraph [ref=f33e229]:
            - text: For more information, please see our
            - link "Privacy Policy" [ref=f33e230] [cursor=pointer]:
              - /url: https://www.etsy.com/legal/privacy
            - text: .
          - paragraph [ref=f33e231]:
            - strong [ref=f33e232]: c. Communication Standards
          - paragraph [ref=f33e233]: i. Messages
          - paragraph [ref=f33e234]: With Etsy's "Messages", you have the ability to communicate directly with your buyers or other Etsy members. Messages are a great way for buyers to ask you questions about an item or an order.
          - paragraph [ref=f33e235]: "Messages may not be used for the following activities:"
          - list [ref=f33e236]:
            - listitem [ref=f33e237]: Sending unsolicited advertising or promotions, requests for donations, or spam;
            - listitem [ref=f33e238]:
              - text: Harassing or abusing another member or violating our
              - link "Discrimination and Hateful Content Policy" [ref=f33e239] [cursor=pointer]:
                - /url: https://www.etsy.com/legal/policy/discrimination-and-hateful-content/123551108902
              - text: ;
            - listitem [ref=f33e240]: Contacting someone after they have explicitly asked you not to;
            - listitem [ref=f33e241]: Interfering with a transaction or the business of another member;
            - listitem [ref=f33e242]:
              - text: Facilitating or directing
              - link "off-platform transactions" [ref=f33e243] [cursor=pointer]:
                - /url: https://www.etsy.com/legal/policy/off-platform-transactions/1254654515806
              - text: ", including exchanging personal contact, financial or other information (phone number, address, email, social media handles, external URLs, instructions for money transfer, QR codes, etc.) for this purpose; requesting buyers make payments off Etsy after checkout, including via peer-to-peer payment services or direct bank transfer; or offering discounts or incentives to purchase through another website or channel."
          - paragraph [ref=f33e244]:
            - strong [ref=f33e245]: Interference
          - paragraph [ref=f33e246]: "Interference occurs when a member intentionally interferes with another member’s shop in order to drive away their business. Interference is strictly prohibited on Etsy. Examples of interference include:"
          - list [ref=f33e247]:
            - listitem [ref=f33e248]: Contacting another member via Messages to warn them away from a particular member, shop, or item;
            - listitem [ref=f33e249]: Posting in public areas to demonstrate or discuss a dispute with another member;
            - listitem [ref=f33e250]: Purchasing from a seller for the sole purpose of leaving a negative review;
            - listitem [ref=f33e251]: Maliciously clicking on a competitor's ads in order to drain that member's advertising budget, also known as "click fraud."
            - listitem [ref=f33e252]: Creating or using an independent buyer account to maliciously upvote another shop’s negative reviews in order to position those reviews more prominently.
          - paragraph [ref=f33e253]:
            - strong [ref=f33e254]: Harassment and Discrimination
          - paragraph [ref=f33e255]:
            - text: Any use of Messages to harass other members is strictly prohibited. Similarly, Messages may not be used to support or glorify hatred or otherwise violate our
            - link "Discrimination and Hateful Content Policy" [ref=f33e256] [cursor=pointer]:
              - /url: https://www.etsy.com/legal/policy/discrimination-and-hateful-content/123551108902
            - text: . If you receive a Message that violates this policy, please let us know right away.
          - paragraph [ref=f33e257]: ii. Forums and Teams
          - paragraph [ref=f33e258]:
            - text: Forums and Teams are public spaces provided by Etsy where sellers can connect, but there are communication standards that must be followed. More information can be found in the Etsy
            - link "Community Policy" [ref=f33e259] [cursor=pointer]:
              - /url: https://www.etsy.com/ie/legal/community/#:~:text=To%20make%20sure%20that%20the,public%20areas%20of%20the%20site
            - text: . Access to Forums and Teams is subject to compliance with Etsy policies and applicable enforcement actions.
          - paragraph [ref=f33e260]: iii. Communicating Cancellations
          - paragraph [ref=f33e261]:
            - text: If you are unable to complete a transaction, you must notify the buyer via Messages and cancel the transaction. If the buyer already submitted payment, you must issue a full refund. You are encouraged to keep proof of any refunds in the event a dispute arises. All cancellations are subject to our
            - link "Cancellation Policy" [ref=f33e262] [cursor=pointer]:
              - /url: https://www.etsy.com/legal/policy/cancellation-policy/253925018785?ref=list
            - text: .
          - paragraph [ref=f33e263]: European Union Right of Withdrawal
          - paragraph [ref=f33e264]:
            - text: Buyers in the European Union (EU), and in parallel buyers in the UK, may be entitled to a 14-day “right of withdrawal” after receiving an item, during which they may return an item for any or no reason. The details of this right vary by EU member state or in the UK. The right of withdrawal may not apply to certain items like custom items or perishable goods. Rights with respect to digital items vary by EU member state or in the UK. Read more about the EU and UK Right of Withdrawal in this
            - link "Help" [ref=f33e265] [cursor=pointer]:
              - /url: https://www.etsy.com/legal/policy/selling-to-eu-buyers/239965962014#:~:text=Right%20to%20return%20items%20(Right,the%20seller%20within%2014%20days.&text=If%20you%20sell%20to%20the,a%20minimum%20of%2014%20days
            - text: article.
          - paragraph [ref=f33e266]: Please be aware that in addition to this policy, each country has its own laws surrounding shipping, cancellations, returns, and exchanges. Please familiarize yourself with the laws of your own country and those of your buyers’ countries.
          - paragraph [ref=f33e267]: Sellers may still cancel an order and work toward a resolution with a buyer as they see fit for policies applied to their shops, such as the digital items policy.
          - heading "3. Feedback, Cases and Your Success" [level=2] [ref=f33e268]
          - paragraph [ref=f33e269]:
            - strong [ref=f33e270]: a. Reviews
          - paragraph [ref=f33e271]:
            - text: Reviews are a great way for you to build a reputation on Etsy. Buyers can leave a
            - link "review" [ref=f33e272] [cursor=pointer]:
              - /url: https://help.etsy.com/hc/articles/115013197687
            - text: ", including a one to five star rating and a photograph or video of their purchase, within 100 days from the earlier date of their item being delivered (where the shipping carrier’s delivery record is available) or their item’s max estimated delivery date. If an estimated delivery date is not available, the review window opens after the order’s"
            - link "processing time" [ref=f33e273] [cursor=pointer]:
              - /url: https://help.etsy.com/hc/articles/115015588087
            - text: and shipping time have elapsed. Buyers of digital items can leave a review for 100 days from the first time they download the item or within 12 months of purchase (whichever happens first). Buyers can
            - link "edit" [ref=f33e274] [cursor=pointer]:
              - /url: https://help.etsy.com/hc/articles/115015521588
            - text: their review, including the photograph or video, any number of times during that 100 day period.
          - paragraph [ref=f33e275]: On the rare occasion you receive an unfavorable review, you can reach out to the buyer or leave a response.
          - paragraph [ref=f33e276]: "In addition to our rules for Creating and Uploading Content in Section 2a, reviews and your response to reviews may not:"
          - list [ref=f33e277]:
            - listitem [ref=f33e278]:
              - text: Contain graphic,
              - link "mature" [ref=f33e279] [cursor=pointer]:
                - /url: https://www.etsy.com/legal/policy/listing-mature-content-correctly/242665462117
              - text: ", or obscene language or imagery, or any content that is subject to our"
              - link "nudity and sexual content policy" [ref=f33e280] [cursor=pointer]:
                - /url: https://www.etsy.com/legal/prohibited/?ref=list#Q7
              - text: ;
            - listitem [ref=f33e281]: Be about things outside the seller’s control, such as a shipping carrier, Etsy or a third party;
            - listitem [ref=f33e282]:
              - text: Include
              - link "shilling" [ref=f33e283] [cursor=pointer]:
                - /url: https://www.etsy.com/legal/policy/shilling/243317364583
              - text: or otherwise falsely inflate a shop’s review score; or
            - listitem [ref=f33e284]: Undermine the integrity of the Reviews system.
          - paragraph [ref=f33e285]:
            - strong [ref=f33e286]: b. Etsy’s Case System
          - paragraph [ref=f33e287]:
            - text: The Case system is how a buyer notifies Etsy of an order issue or dispute that they’re unable to resolve with a seller, in order for Etsy to help them reach a resolution.
            - strong [ref=f33e288]: Buyers must contact sellers directly via the Help with Order link and attempt to resolve any outstanding issues before opening a case on Etsy
            - text: . For this reason, it is important that you fill out your shop policies and regularly respond to Messages from your buyers. Once a buyer contacts you to notify you of a problem with an order, you will have 48 hours to resolve the issue. If the issue is unresolved in this time frame, a case may be opened by the buyer. Once a case has been opened, Etsy will assist in the resolution of the case between the buyer and seller. This may include, but is not limited to, automatically closing the case and issuing a refund to the buyer (to the original form of payment or in the form of Etsy credit), or reviewing the case further to help the buyer and seller resolve it as quickly as possible.
          - paragraph [ref=f33e289]: Etsy reserves the right to resolve an order issue before the 48-hour window for circumstances including, but not limited to, seller inactivity, harassment, refusal of service, manipulation, and undermining the integrity of the case system.
          - paragraph [ref=f33e290]:
            - text: Buyers may file a case for items that never arrive, arrive late or, arrive damaged, or do not match the listing description as part of Etsy’s Purchase Protection Program (for more information on case eligibility, click
            - link "here" [ref=f33e291] [cursor=pointer]:
              - /url: https://www.etsy.com/legal/policy/cases-policy/243306189901
            - text: . Etsy may request your assistance in resolving a case opened against your shop. By using Etsy’s case system, you understand that Etsy may use your personal information for the purpose of resolving disputes with other members. For more information on our privacy policy,
            - link "click here" [ref=f33e292] [cursor=pointer]:
              - /url: https://www.etsy.com/legal/privacy
            - text: .
          - paragraph [ref=f33e293]:
            - strong [ref=f33e294]: c. Etsy's Purchase Protection Program for Sellers
          - paragraph [ref=f33e295]:
            - text: For certain cases, sellers are protected by Etsy's Purchase Protection Program. If the case falls outside of Etsy's
            - link "Purchase Protection Program for Sellers" [ref=f33e296] [cursor=pointer]:
              - /url: https://www.etsy.com/legal/policy/seller-protection-policy/34509585385?ref=list
            - text: ", unless otherwise required by law, you will be required to refund the order, including original shipping and return shipping. This may include any unexpected costs incurred by the buyer after the completion of the transaction, such as customs duties or import fees, where those costs arose as a result of the seller's failure to use a Delivery Duty Paid (DDP) shipping method when required. Etsy reserves the right to issue a refund to the buyer (to the original form of payment or in the form of Etsy credit) and recoup funds from your account, including your payment account reserve, if payment was made via Etsy Payments."
          - paragraph [ref=f33e297]:
            - strong [ref=f33e298]: d. Your Seller Account and Etsy’s Terms
          - paragraph [ref=f33e299]:
            - text: In order to keep Etsy safe and improve our Services, we may take actions that limit the visibility of your shop, listings or ads, or that impact your payment account. In the event a shop sees unusual order activity, you do not meet our minimum customer service standards or we otherwise believe that your actions or shop may result in buyer disputes, chargebacks, increased risk of fraud, counterfeiting, or other claims, Etsy may take actions such as limiting visibility of your account or listings, placing restrictions or reserves on your payments account, or suspending your Etsy account, in accordance with our
            - link "Terms of Use" [ref=f33e300] [cursor=pointer]:
              - /url: https://www.etsy.com/legal/terms-of-use
            - text: ", including this Policy and our"
            - link "Etsy Payments Policy" [ref=f33e301] [cursor=pointer]:
              - /url: https://www.etsy.com/legal/etsy-payments/?ref=list
            - text: . When appropriate and permitted by law, Etsy will communicate information to the affected seller about the issue.
          - paragraph [ref=f33e302]:
            - text: In the event a shop sees an unusual spike in orders, particularly in a high demand category, a shop may see an increase or decrease in its search ranking. Often, if a shop sees an increase in fulfilled orders and good reviews, this may result in higher visibility and search rank. However, sometimes a rapid increase in orders can reduce visibility. Read more about how Etsy search works, and what factors impact search ranking, and how you can help optimize your listings and shop
            - link "here" [ref=f33e303] [cursor=pointer]:
              - /url: https://www.etsy.com/legal/policy/search-advertisement-ranking-disclosures/899478564529
            - text: and in
            - link "The Ultimate Guide to Etsy Search" [ref=f33e304] [cursor=pointer]:
              - /url: https://www.etsy.com/ie/seller-handbook/article/the-ultimate-guide-to-etsy-search/366469415790
            - text: .
          - paragraph [ref=f33e305]: In addition, we may limit the visibility of listings or ads in the interest of keeping Etsy safe, and improving our Services. For example, listings or ads may have decreased visibility because they include terms that represent a prohibited item or based on third party policies. These listings or ads may also be restricted from appearing in one or more features of the Services. While these listings or ads may have limited visibility, they are still discoverable in search.
          - paragraph [ref=f33e306]: Etsy may make changes to onboarding or authentication processes for sellers at our sole discretion. Completion of these processes may be required for seller account activation or continued access and usage.
          - paragraph [ref=f33e307]:
            - text: If Etsy has reason to believe you, Your Content, or your use of the Services violate our Terms, including this Seller Policy, we may deactivate Your Content to some or all users, or suspend or terminate your account (and any accounts Etsy determines are related to your account) and your access to the Services. Sellers in the European Union can see more information
            - link "here" [ref=f33e308] [cursor=pointer]:
              - /url: https://help.etsy.com/hc/en-gb/articles/360051541413?segment=selling
            - text: . Generally, Etsy will notify you that Your Content or account has been suspended or terminated, unless you’ve repeatedly violated our Terms or we have legal or regulatory reasons preventing us from notifying you.
          - paragraph [ref=f33e309]: Last updated on Jun 9, 2026
