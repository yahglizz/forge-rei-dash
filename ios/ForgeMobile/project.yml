name: ForgeMobile
options:
  bundleIdPrefix: com.atouchofblessings
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  ForgeMobile:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Assets.xcassets
    info:
      path: App/Info.plist
      properties:
        # The box is reached over Tailscale (https, MagicDNS). NSAllowsLocalNetworking
        # additionally lets a dev build point at the SSH tunnel (http://localhost:7799)
        # via the ForgeBaseURL launch argument — it does NOT open arbitrary http.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIStatusBarStyle: UIStatusBarStyleDarkContent
        UIViewControllerBasedStatusBarAppearance: false
        ForgeBaseURL: https://forge-reios.tail0a2dda.ts.net/m/
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atouchofblessings.forgemobile
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        # Automatic signing, team NOT hardcoded (differs per machine). For a device
        # build pass DEVELOPMENT_TEAM=<id> on the xcodebuild line or pick it in Xcode.
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: FORGE
        # More → Send Contract has an <input type=file>; in WKWebView the picker offers
        # "Take Photo" and iOS kills the app on camera access without these strings.
        INFOPLIST_KEY_NSCameraUsageDescription: Attach a photo of a document.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Choose a document image to attach.
        # HTTPS only, no bundled crypto — skips the export-compliance stop on upload.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
